<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="{{prefix}}assets/style.css">
</head>
<body>
<a class="skip" href="#main">跳到內文</a>
<header class="topbar">
  <button class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false">目錄</button>
  <a class="brand" href="{{prefix}}index.html">{{site}}</a>
  <button class="theme-btn" type="button" aria-label="切換深淺色">深淺</button>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="brand brand-side" href="{{prefix}}index.html">{{site}}</a>
    <div class="search">
      <input type="search" id="q" placeholder="搜尋筆記…" aria-label="搜尋筆記" autocomplete="off">
      <ul id="results" class="results" hidden></ul>
    </div>
    <nav aria-label="網站目錄">{{sidebar}}</nav>
  </aside>
  <main id="main" class="content">
    <article>
{{content}}
    </article>
    <footer class="site-foot">整理自課堂投影片，以自己的話改寫。原始投影片與圖片版權屬於授課老師。</footer>
  </main>
  <aside class="toc-wrap">{{toc}}</aside>
</div>
<script>window.SITE_PREFIX = "{{prefix}}";</script>
<script src="{{prefix}}assets/search-index.js"></script>
<script src="{{prefix}}assets/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.querySelector('article'),{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})"></script>
</body>
</html>
